<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOARDROOM 2026</title>
    <!-- 게임형 스킨 서체(T64): 오프라인 부스를 위해 public/fonts/에서 로컬로 싣는다(외부
         요청 없음). preload로 첫 페인트부터 타자기 라벨·HUD 판독 글자가 제대로 보인다. -->
    <link
      rel="preload"
      href="/fonts/special-elite-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/share-tech-mono-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
