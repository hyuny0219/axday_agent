name: Pages

# GitHub Pages에 scripted 전용 정적 배포를 올린다(T37). 서버(server/)가 없으므로 live
# 모드는 이 배포에서 쓸 수 없다 — /api/health가 애초에 없으니 항상 scripted로 떨어진다.
# 행사 당일 운영은 로컬 서버를 쓰고, 이 워크플로는 테스트·시연용이다.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (scripted-only, base=/<repo>/)
        run: VITE_BASE=/${{ github.event.repository.name }}/ npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
